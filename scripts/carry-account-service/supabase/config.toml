project_id = "carry-account"

[functions.carry-account]
verify_jwt = true

[functions.carry-data]
verify_jwt = true

[functions.carry-assets]
verify_jwt = true

[functions.carry-cleanup]
verify_jwt = true

# Auth identity may already be gone: the handler authenticates a 256-bit receipt
# and returns only deletion progress. All account/data routes keep JWT checks.
[functions.carry-account-status]
verify_jwt = false

[functions.carry-maintenance]
verify_jwt = true

# OAuth metadata/code exchange and opaque MCP bearers use the handler's own
# verification. The new runtime additionally defaults ACCOUNT_AI_ENABLED off.
[functions.carry-ai]
verify_jwt = false
entrypoint = "./functions/carry-ai/index.ts"
import_map = "./functions/carry-ai/deno.json"
