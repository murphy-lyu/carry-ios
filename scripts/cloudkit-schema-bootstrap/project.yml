name: CarrySchemaBootstrap
options:
  bundleIdPrefix: app.nevestudio.carry
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 25RAM7275Z
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  CarrySchemaBootstrap:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nevestudio.carry.schema-bootstrap
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Carry Schema Check
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: Bootstrap.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
schemes:
  CarrySchemaBootstrap:
    build:
      targets:
        CarrySchemaBootstrap: all
    run:
      config: Debug
